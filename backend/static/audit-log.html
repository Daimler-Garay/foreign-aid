<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audit Log</title><link rel="stylesheet" href="/app.css"></head>
  <body data-page="audit-log">
    <header class="topbar leaderboard-topbar">
      <div class="brand mark">COUP<span>RANK</span></div>
      <nav class="nav">
        <a href="/leaderboard">Leaderboard</a>
        <a href="/players">Players</a>
        <a href="/matches">Matches</a>
        <a href="/matches/new" data-admin-only>Submit</a>
        <a class="active" href="/admin/audit-log" data-admin-only>Audit</a>
      </nav>
      <a id="login-link" class="button secondary compact" href="/login" data-anonymous-only>Log In</a>
      <button id="logout" class="secondary compact" data-auth-only>Log Out</button>
    </header>
    <main class="main leaderboard-main">
      <section class="leaderboard-hero">
        <div>
          <p class="eyebrow">System trail</p>
          <h1>Audit Log</h1>
        </div>
        <div class="hero-meta">
          <span>Admin</span>
          <strong>Newest first</strong>
        </div>
      </section>
      <section class="panel stack" data-admin-only><div class="actions"><label>Limit <input id="limit" type="number" min="1" max="500" value="100"></label></div><div id="status" class="status"></div><div id="audit-log"></div></section>
      <section class="panel stack" data-non-admin-only><h2>Admin Login Required</h2><p class="muted">Only admins can view the audit log.</p><a class="button compact" href="/login" data-anonymous-only>Log In</a></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
