<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Players</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-page="players">
    <header class="topbar leaderboard-topbar">
      <div class="brand mark">COUP<span>RANK</span></div>
      <nav class="nav">
        <a href="/leaderboard">Leaderboard</a>
        <a class="active" href="/players">Players</a>
        <a href="/matches">Matches</a>
        <a href="/matches/new" data-admin-only>Submit</a>
        <a href="/admin/audit-log" data-admin-only>Audit</a>
      </nav>
      <a
        id="login-link"
        class="button secondary compact"
        href="/login"
        data-anonymous-only
        >Log In</a
      >
      <button id="logout" class="secondary compact" data-auth-only>
        Log Out
      </button>
    </header>
    <main class="main leaderboard-main stack">
      <section class="leaderboard-hero">
        <div>
          <p class="eyebrow">Player registry</p>
          <h1>Players</h1>
        </div>
        <div class="hero-meta">
          <span>Admin</span>
          <strong>Create and manage</strong>
        </div>
      </section>
      <section class="players-grid">
        <section class="panel stack players-list-panel">
          <div class="panel-heading">
            <div class="actions players-actions">
              <button
                id="open-create-player"
                class="button compact create-player-trigger"
                type="button"
              >
                Create Player
              </button>
            </div>
          </div>
          <div id="players"></div>
        </section>
      </section>
      <dialog id="create-player-dialog" class="modal-dialog">
        <form id="create-player-form" class="modal-card stack">
          <div class="modal-heading">
            <h2>Create Player</h2>
            <button
              id="close-create-player"
              class="icon-button"
              type="button"
              aria-label="Close create player"
              title="Close"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
          <label>Display name <input name="display_name" required /></label>
          <button type="submit">Create</button>
          <div id="create-status" class="status"></div>
        </form>
      </dialog>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
