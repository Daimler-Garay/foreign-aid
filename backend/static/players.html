<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Players</title><link rel="stylesheet" href="/app.css"></head>
  <body data-page="players">
    <header class="topbar leaderboard-topbar">
      <div class="brand mark">COUP<span>RANK</span></div>
      <nav class="nav">
        <a href="/leaderboard">Leaderboard</a>
        <a class="active" href="/players">Players</a>
        <a href="/matches">Matches</a>
        <a href="/matches/new">Submit</a>
        <a href="/admin/audit-log">Audit</a>
      </nav>
      <button id="logout" class="secondary compact">Log Out</button>
    </header>
    <main class="main leaderboard-main stack">
      <section class="leaderboard-hero">
        <div>
          <p class="eyebrow">Player registry</p>
          <h1>Players</h1>
        </div>
        <div class="hero-meta">
          <span>Admin</span>
          <strong>Create and manage</strong>
        </div>
      </section>
      <section class="grid players-grid">
        <form id="create-player-form" class="panel stack create-player-panel"><h2>Create Player</h2><label>Display name <input name="display_name" required></label><button type="submit">Create</button><div id="create-status" class="status"></div></form>
        <section class="panel stack players-list-panel"><h2>Players</h2><div class="actions"><label><span>Include inactive</span><input id="include-inactive" type="checkbox"></label><button id="refresh">Refresh</button></div><div id="status" class="status"></div><div id="players"></div></section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
