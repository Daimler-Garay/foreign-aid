<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submit Match</title><link rel="stylesheet" href="/app.css"></head>
  <body data-page="submit-match">
    <header class="topbar"><div class="brand">Coup Leaderboard</div><nav class="nav"><a href="/leaderboard">Leaderboard</a><a href="/players">Players</a><a href="/matches">Matches</a><a href="/matches/new">Submit</a><a href="/admin/audit-log">Audit</a></nav></header>
    <main class="main">
      <div class="heading-row"><h1>Submit Match</h1><button id="logout" class="secondary">Log Out</button></div>
      <form id="submit-match-form" class="panel stack"><label>Played at <input name="played_at" type="datetime-local" required></label><label>Notes <textarea name="notes" rows="3"></textarea></label><div id="participant-fields" class="stack"></div><button type="submit">Submit</button><div id="status" class="status"></div></form>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
