<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submit Match</title><link rel="stylesheet" href="/app.css"></head>
  <body data-page="submit-match">
    <header class="topbar leaderboard-topbar">
      <div class="brand mark">COUP<span>RANK</span></div>
      <nav class="nav">
        <a href="/leaderboard">Leaderboard</a>
        <a href="/players">Players</a>
        <a href="/matches">Matches</a>
        <a class="active" href="/matches/new" data-admin-only>Submit</a>
        <a href="/admin/audit-log" data-admin-only>Audit</a>
      </nav>
      <a id="login-link" class="button secondary compact" href="/login" data-anonymous-only>Log In</a>
      <button id="logout" class="secondary compact" data-auth-only>Log Out</button>
    </header>
    <main class="main leaderboard-main">
      <section class="leaderboard-hero">
        <div>
          <p class="eyebrow">Record results</p>
          <h1>Submit Match</h1>
        </div>
        <div class="hero-meta">
          <span>Status</span>
          <strong>Confirmed game</strong>
        </div>
      </section>
      <form id="submit-match-form" class="panel stack" data-admin-only><label>Played at <input name="played_at" type="datetime-local" required></label><label>Notes <textarea name="notes" rows="3"></textarea></label><div id="participant-fields" class="stack"></div><button type="submit">Submit</button><div id="status" class="status"></div></form>
      <section class="panel stack" data-non-admin-only><h2>Admin Login Required</h2><p class="muted">Only admins can submit match results.</p><a class="button compact" href="/login" data-anonymous-only>Log In</a></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
