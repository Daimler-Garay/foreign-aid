name: Backend

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: foreign_aid
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U admin -d foreign_aid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_HOST: 127.0.0.1
      APP_PORT: 3000
      DATABASE_URL: postgres://admin:admin@localhost:5433/foreign_aid
      DATABASE_MAX_CONNECTIONS: 5
      RUST_LOG: info

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format
        working-directory: backend
        run: cargo fmt --check
      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: backend
        run: cargo test
      - name: Release build
        working-directory: backend
        run: cargo build --release

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping deploy."
            exit 0
          fi

          curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"
